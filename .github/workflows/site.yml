# Builds the website (site/build.py) and publishes it to GitHub Pages.
# Runs when the site, the logo or the app version changes, and on every release.
name: Website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "veri/io.github.abdullahnil.Drivux.svg"
      - "docs/logo.png"
      - "drivux/ortak.py"
      - ".github/workflows/site.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: python3 site/build.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
