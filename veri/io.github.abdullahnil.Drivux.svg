<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="zemin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef1f5"/>
    </linearGradient>
    <filter id="golge" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect x="10" y="10" width="108" height="108" rx="26" fill="url(#zemin)" filter="url(#golge)"/>

  <!-- triangle: three coloured sides with gaps at the corners -->
  <g fill="none" stroke-width="12" stroke-linecap="round">
    <path d="M57 33 L33 74" stroke="#34a853"/>
    <path d="M71 33 L95 74" stroke="#fbbc04"/>
    <path d="M86 89 L42 89" stroke="#4285f4"/>
  </g>
  <g fill="#ffffff" stroke="#5f6368" stroke-width="3.5">
    <circle cx="64" cy="25" r="6"/>
    <circle cx="27" cy="89" r="6"/>
    <circle cx="101" cy="89" r="6"/>
  </g>

  <!-- Tux-style penguin sitting on the blue side -->
  <g>
    <!-- body -->
    <ellipse cx="64" cy="70" rx="13" ry="17" fill="#232629"/>
    <!-- flippers -->
    <ellipse cx="51.5" cy="73" rx="4" ry="9" transform="rotate(18 51.5 73)" fill="#232629"/>
    <ellipse cx="76.5" cy="73" rx="4" ry="9" transform="rotate(-18 76.5 73)" fill="#232629"/>
    <!-- belly -->
    <ellipse cx="64" cy="75" rx="9" ry="11.5" fill="#ffffff"/>
    <!-- head -->
    <circle cx="64" cy="54" r="10" fill="#232629"/>
    <!-- eyes -->
    <ellipse cx="60.2" cy="52.5" rx="3" ry="3.8" fill="#ffffff"/>
    <ellipse cx="67.8" cy="52.5" rx="3" ry="3.8" fill="#ffffff"/>
    <circle cx="60.9" cy="53.3" r="1.5" fill="#232629"/>
    <circle cx="67.1" cy="53.3" r="1.5" fill="#232629"/>
    <!-- beak -->
    <path d="M58.8 58.2 Q64 55.6 69.2 58.2 Q64 63 58.8 58.2 Z" fill="#f5a623"/>
    <!-- feet -->
    <ellipse cx="57.5" cy="87.5" rx="6.5" ry="3" fill="#f5a623"/>
    <ellipse cx="70.5" cy="87.5" rx="6.5" ry="3" fill="#f5a623"/>
  </g>
</svg>
