<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="zemin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef1f5"/>
    </linearGradient>
    <filter id="golge" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- zemin -->
  <rect x="10" y="10" width="108" height="108" rx="26" fill="url(#zemin)" filter="url(#golge)"/>
  <!-- üç kenarlı yuvarlak üçgen: her kenar ayrı renk, köşelerde boşluk -->
  <g fill="none" stroke-width="13" stroke-linecap="round">
    <path d="M57 35 L36 72" stroke="#34a853"/>
    <path d="M71 35 L92 72" stroke="#fbbc04"/>
    <path d="M84 86 L44 86" stroke="#4285f4"/>
  </g>
  <!-- köşe düğümleri -->
  <g fill="#ffffff" stroke="#5f6368" stroke-width="3.5">
    <circle cx="64" cy="27" r="6"/>
    <circle cx="30" cy="86" r="6"/>
    <circle cx="98" cy="86" r="6"/>
  </g>
</svg>
